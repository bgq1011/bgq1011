name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    # 03:41 UTC daily, offset from the metrics job so the two never race.
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#1de9b6
            dist/github-contribution-grid-snake.svg?color_snake=#1de9b6&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/github-contribution-grid-snake-dark.svg dist/github-contribution-grid-snake.svg

          if git diff --cached --quiet; then
            echo "No snake changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore(profile): refresh contribution snake [skip ci]"
          git push
