<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-label="Telemetry dashboard awaiting first sync.">
  <title>GITHUB TELEMETRY — awaiting first sync</title>
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="1" stop-color="#0a1017"/>
    </linearGradient>
    <linearGradient id="phEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1de9b6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="phGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1de9b6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="phFrame"><rect x="1" y="1" width="998" height="178" rx="14"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .cur { animation: b 1.15s steps(1, end) infinite; }
    @keyframes b { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <g clip-path="url(#phFrame)">
    <rect width="1000" height="180" fill="url(#phBg)"/>
    <rect width="1000" height="180" fill="url(#phGrid)"/>
    <rect x="1" y="1" width="998" height="34" fill="#0d141c"/>
    <line x1="0" y1="35" x2="1000" y2="35" stroke="#1de9b6" stroke-opacity="0.18"/>
    <circle cx="24" cy="18" r="4" fill="#d29922"/>
    <text class="mono" x="42" y="23" font-size="12" fill="#4a5a68">telemetry --live</text>
    <text class="mono" x="976" y="23" font-size="11" fill="#4a5a68" text-anchor="end">SYNC PENDING</text>

    <text class="mono" x="28" y="80" font-size="14">
      <tspan fill="#d29922">[ WAIT ]</tspan>
      <tspan fill="#e6edf3" dx="10" font-weight="bold" letter-spacing="1.2">TELEMETRY DASHBOARD NOT YET GENERATED</tspan>
    </text>
    <text class="mono" x="28" y="112" font-size="12.5" fill="#a9c2d1">Run the “Update Profile Metrics” workflow to populate this panel with live GitHub data.</text>
    <text class="mono" x="28" y="146" font-size="13">
      <tspan fill="#1de9b6">$</tspan>
      <tspan fill="#e6edf3" dx="8">gh workflow run update-profile.yml</tspan>
      <tspan class="cur" fill="#1de9b6" dx="6" font-weight="bold">&#9608;</tspan>
    </text>
  </g>
  <rect x="1" y="1" width="998" height="178" rx="14" fill="none" stroke="url(#phEdge)" stroke-width="1.5"/>
</svg>
