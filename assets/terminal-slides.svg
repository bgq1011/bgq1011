<svg xmlns="http://www.w3.org/2000/svg" width="740" height="270" viewBox="0 0 740 270" role="img" aria-label="Business analysis pipeline console: elicit, model, specify">
  <title>analysis console — elicit / model / specify</title>
  <defs>
    <linearGradient id="tsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <clipPath id="tsClip"><rect width="740" height="270" rx="10"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace}
    .pane{opacity:0;animation:pane 21s steps(1,end) infinite}
    @keyframes pane{0%{opacity:1}33.33%{opacity:1}33.34%{opacity:0}100%{opacity:0}}
    .cur{animation:blink 1.15s steps(1,end) infinite}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .pane,.cur{animation:none}
      .pane{opacity:0}
      .pane:first-of-type{opacity:1}
    }
  </style>
  <rect width="740" height="270" rx="10" fill="url(#tsBg)"/>
  <g clip-path="url(#tsClip)">
    <!-- title bar -->
    <rect width="740" height="30" fill="#05080c"/>
    <g>
      <circle cx="20" cy="15" r="4.5" fill="#f85149" fill-opacity="0.85"/>
      <circle cx="38" cy="15" r="4.5" fill="#d29922" fill-opacity="0.85"/>
      <circle cx="56" cy="15" r="4.5" fill="#3fb950" fill-opacity="0.85"/>
    </g>
    <text class="mono" x="370" y="19" text-anchor="middle" font-size="10" fill="#4a5a68" letter-spacing="2">bgq1011 — analysis console</text>
    <rect y="30" width="740" height="1" fill="#1de9b6" fill-opacity="0.2"/>

    <g class="mono pane" style="animation-delay:0s">
      <text x="26" y="60" font-size="12"><tspan fill="#3fb950">bgq1011@analysis</tspan><tspan fill="#4a5a68" dx="6">:~$</tspan><tspan fill="#e6edf3" dx="8">elicit --stakeholder all --until unambiguous</tspan></text>
      <text x="26" y="88" font-size="10" fill="#4a5a68" letter-spacing="1.5">STAGE 1 / 3  //  PIPELINE RUNNING</text>
      <text x="26" y="128" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">interviews + workshops logged</tspan></text>
      <text x="26" y="152" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">stated request separated from real need</tspan></text>
      <text x="26" y="176" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">root cause isolated, symptom discarded</tspan></text>
      <text x="26" y="200" font-size="11.5"><tspan fill="#d29922">[WARN]</tspan><tspan fill="#a9c2d1" dx="10">3 open questions queued for follow-up</tspan></text>
      <text x="26" y="224" font-size="11.5"><tspan fill="#e6edf3">  ==&gt; </tspan><tspan fill="#e6edf3" dx="10">RAW NEED CAPTURED — 0 assumptions unlogged</tspan></text>
    </g>
    <g class="mono pane" style="animation-delay:7s">
      <text x="26" y="60" font-size="12"><tspan fill="#3fb950">bgq1011@analysis</tspan><tspan fill="#4a5a68" dx="6">:~$</tspan><tspan fill="#e6edf3" dx="8">model --as-is --to-be --notation bpmn2</tspan></text>
      <text x="26" y="88" font-size="10" fill="#4a5a68" letter-spacing="1.5">STAGE 2 / 3  //  PIPELINE RUNNING</text>
      <text x="26" y="128" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">as-is flow mapped, 2 bottlenecks flagged</tspan></text>
      <text x="26" y="152" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">to-be flow drafted with swimlanes</tspan></text>
      <text x="26" y="176" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">UML use case + sequence attached</tspan></text>
      <text x="26" y="200" font-size="11.5"><tspan fill="#d29922">[WARN]</tspan><tspan fill="#a9c2d1" dx="10">handoff at step 04 needs owner sign-off</tspan></text>
      <text x="26" y="224" font-size="11.5"><tspan fill="#e6edf3">  ==&gt; </tspan><tspan fill="#e6edf3" dx="10">MODEL VALIDATED — process is now obvious</tspan></text>
    </g>
    <g class="mono pane" style="animation-delay:14s">
      <text x="26" y="60" font-size="12"><tspan fill="#3fb950">bgq1011@analysis</tspan><tspan fill="#4a5a68" dx="6">:~$</tspan><tspan fill="#e6edf3" dx="8">specify --format story --with-acceptance-criteria</tspan></text>
      <text x="26" y="88" font-size="10" fill="#4a5a68" letter-spacing="1.5">STAGE 3 / 3  //  PIPELINE RUNNING</text>
      <text x="26" y="128" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">user stories sliced to deliverable size</tspan></text>
      <text x="26" y="152" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">Given / When / Then criteria written</tspan></text>
      <text x="26" y="176" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">traceability matrix linked to REQ ids</tspan></text>
      <text x="26" y="200" font-size="11.5"><tspan fill="#3fb950">[ OK ]</tspan><tspan fill="#a9c2d1" dx="10">definition of done agreed with team</tspan></text>
      <text x="26" y="224" font-size="11.5"><tspan fill="#e6edf3">  ==&gt; </tspan><tspan fill="#e6edf3" dx="10">SPEC TESTABLE — 0 orphaned requirements</tspan></text>
    </g>

    <text class="mono cur" x="26" y="244" font-size="12" fill="#1de9b6">_</text>
    <text class="mono" x="714" y="244" text-anchor="end" font-size="9" fill="#4a5a68" letter-spacing="1.5">auto-advance 7s</text>
  </g>
  <rect x="0.5" y="0.5" width="739" height="269" rx="10" fill="none" stroke="#1de9b6" stroke-opacity="0.22"/>
</svg>
