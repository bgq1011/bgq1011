<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Business Analysis System Online. User: GIA QUYEN. Role: IT Business Analyst. Status: building better systems.">
  <title>BUSINESS ANALYSIS SYSTEM ONLINE — GIA QUYEN — IT BUSINESS ANALYST</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.55" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1de9b6" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1de9b6" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1de9b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1de9b6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1de9b6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1de9b6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#1de9b6" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1de9b6" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="998" height="318" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .dim    { fill: #4a5a68; }
    .txt    { fill: #a9c2d1; }
    .cyan   { fill: #1de9b6; }
    .blue   { fill: #58a6ff; }
    .green  { fill: #3fb950; }
    .amber  { fill: #d29922; }
    .white  { fill: #e6edf3; }

    .ln { animation: fade 0.45s ease-out backwards; }
    .d1 { animation-delay: 0.10s; } .d2 { animation-delay: 0.30s; }
    .d3 { animation-delay: 0.50s; } .d4 { animation-delay: 0.70s; }
    .d5 { animation-delay: 0.90s; } .d6 { animation-delay: 1.10s; }
    .d7 { animation-delay: 1.30s; } .d8 { animation-delay: 1.50s; }

    .cursor { animation: blink 1.15s steps(1, end) infinite; }
    .scan   { animation: scan 8s linear infinite; }
    .pulse  { animation: pulse 2.4s ease-in-out infinite; }
    .pulse2 { animation: pulse 2.4s ease-in-out 0.8s infinite; }
    .pulse3 { animation: pulse 2.4s ease-in-out 1.6s infinite; }

    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes scan  { 0% { transform: translateY(-60px); } 100% { transform: translateY(330px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <rect width="1000" height="320" filter="url(#noise)" opacity="0.035"/>
    <rect width="1000" height="120" fill="url(#glow)"/>

    <!-- title bar -->
    <rect x="1" y="1" width="998" height="34" fill="#0d141c"/>
    <line x1="0" y1="35" x2="1000" y2="35" stroke="#1de9b6" stroke-opacity="0.18"/>
    <circle cx="24" cy="18" r="4.5" fill="#f85149" opacity="0.85"/>
    <circle cx="42" cy="18" r="4.5" fill="#d29922" opacity="0.85"/>
    <circle cx="60" cy="18" r="4.5" fill="#3fb950" opacity="0.85"/>
    <text class="mono dim" x="84" y="23" font-size="12">gia-quyen@github:~/ba-system</text>
    <text class="mono dim" x="976" y="23" font-size="11" text-anchor="end">tty0 · secure shell</text>

    <!-- terminal boot log -->
    <text class="mono" x="28" y="70" font-size="14">
      <tspan class="ln d1 cyan">$</tspan>
      <tspan class="ln d1 white" dx="8">./init_ba_system --user "GIA QUYEN" --mode analyst</tspan>
    </text>

    <text class="mono ln d2" x="28" y="102" font-size="14">
      <tspan class="green">[ OK ]</tspan>
      <tspan class="white" dx="10" font-weight="bold" letter-spacing="1.2">BUSINESS ANALYSIS SYSTEM ONLINE</tspan>
    </text>

    <text class="mono ln d3" x="28" y="132" font-size="13.5">
      <tspan class="green">[ OK ]</tspan>
      <tspan class="txt" dx="10">USER</tspan>
      <tspan class="dim" dx="8">.................</tspan>
      <tspan class="cyan" dx="8" letter-spacing="1">GIA QUYEN</tspan>
    </text>

    <text class="mono ln d4" x="28" y="160" font-size="13.5">
      <tspan class="green">[ OK ]</tspan>
      <tspan class="txt" dx="10">ROLE</tspan>
      <tspan class="dim" dx="8">.................</tspan>
      <tspan class="cyan" dx="8" letter-spacing="1">IT BUSINESS ANALYST</tspan>
    </text>

    <text class="mono ln d5" x="28" y="188" font-size="13.5">
      <tspan class="blue">[ RUN ]</tspan>
      <tspan class="txt" dx="6">REQUIREMENTS ENGINE</tspan>
      <tspan class="dim" dx="8">..</tspan>
      <tspan class="green" dx="8">ACTIVE</tspan>
    </text>

    <text class="mono ln d6" x="28" y="216" font-size="13.5">
      <tspan class="blue">[ RUN ]</tspan>
      <tspan class="txt" dx="6">PROCESS ANALYSIS</tspan>
      <tspan class="dim" dx="8">.....</tspan>
      <tspan class="green" dx="8">RUNNING</tspan>
    </text>

    <text class="mono ln d7" x="28" y="244" font-size="13.5">
      <tspan class="blue">[ RUN ]</tspan>
      <tspan class="txt" dx="6">STAKEHOLDER CHANNEL</tspan>
      <tspan class="dim" dx="8">..</tspan>
      <tspan class="green" dx="8">LISTENING</tspan>
    </text>

    <text class="mono ln d8" x="28" y="282" font-size="15">
      <tspan class="cyan">&gt;</tspan>
      <tspan class="white" dx="8" font-weight="bold" letter-spacing="1.4">STATUS: BUILDING BETTER SYSTEMS</tspan>
      <tspan class="cyan cursor" dx="6" font-weight="bold">&#9608;</tspan>
    </text>

    <!-- module panel -->
    <g class="ln d4">
      <rect x="640" y="58" width="336" height="180" rx="10" fill="#0a1017" fill-opacity="0.72" stroke="#1de9b6" stroke-opacity="0.16"/>
      <text class="mono dim" x="660" y="80" font-size="10.5" letter-spacing="1.6">ACTIVE MODULES</text>
      <line x1="660" y1="90" x2="956" y2="90" stroke="#1de9b6" stroke-opacity="0.12"/>

      <circle class="pulse" cx="666" cy="112" r="3.5" fill="#1de9b6"/>
      <text class="mono txt" x="682" y="116" font-size="12">requirement.analysis</text>
      <text class="mono green" x="956" y="116" font-size="11" text-anchor="end">ONLINE</text>

      <circle class="pulse2" cx="666" cy="140" r="3.5" fill="#58a6ff"/>
      <text class="mono txt" x="682" y="144" font-size="12">process.modeling.bpmn</text>
      <text class="mono green" x="956" y="144" font-size="11" text-anchor="end">ONLINE</text>

      <circle class="pulse3" cx="666" cy="168" r="3.5" fill="#1de9b6"/>
      <text class="mono txt" x="682" y="172" font-size="12">spec.writer.brd_srs</text>
      <text class="mono green" x="956" y="172" font-size="11" text-anchor="end">ONLINE</text>

      <circle class="pulse2" cx="666" cy="196" r="3.5" fill="#d29922"/>
      <text class="mono txt" x="682" y="200" font-size="12">data.query.sql</text>
      <text class="mono amber" x="956" y="200" font-size="11" text-anchor="end">TRAINING</text>

      <circle class="pulse" cx="666" cy="224" r="3.5" fill="#58a6ff"/>
      <text class="mono txt" x="682" y="228" font-size="12">agile.scrum.delivery</text>
      <text class="mono green" x="956" y="228" font-size="11" text-anchor="end">ONLINE</text>
    </g>

    <text class="mono dim ln d8" x="976" y="282" font-size="10.5" text-anchor="end" letter-spacing="1.4">FROM BUSINESS NEED TO WORKING SYSTEM</text>

    <!-- subtle scan line -->
    <rect class="scan" x="0" y="0" width="1000" height="56" fill="url(#scanGrad)"/>
  </g>

  <rect x="1" y="1" width="998" height="318" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
