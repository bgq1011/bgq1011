<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="Section divider">
  <title>system divider</title>
  <defs>
    <linearGradient id="dLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1de9b6" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#1de9b6" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="0.85" stop-color="#1de9b6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1de9b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1de9b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e6edf3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1de9b6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .glide { animation: glide 9s linear infinite; }
    @keyframes glide { 0% { transform: translateX(-180px); } 100% { transform: translateX(1000px); } }
  </style>

  <rect y="11" width="1000" height="2" fill="url(#dLine)"/>
  <rect class="glide" y="11" width="180" height="2" fill="url(#dPulse)"/>

  <g fill="#1de9b6" fill-opacity="0.5">
    <rect x="0" y="8" width="2" height="8"/>
    <rect x="998" y="8" width="2" height="8"/>
  </g>
  <g fill="#58a6ff" fill-opacity="0.35">
    <rect x="248" y="9" width="2" height="6"/>
    <rect x="498" y="7" width="2" height="10"/>
    <rect x="748" y="9" width="2" height="6"/>
  </g>
</svg>
